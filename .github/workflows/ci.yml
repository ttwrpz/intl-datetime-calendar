name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring
          coverage: none
          tools: composer

      - name: Report the ICU version
        run: php -r 'echo "ICU ", INTL_ICU_VERSION, PHP_EOL;'

      - name: Lint every PHP file
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: The engine must match PHP's own date()
        run: php tests/php/native-parity.php

      - name: Regressions fixed in 2.0.0 must stay fixed
        run: php tests/php/regressions.php

      - name: Install coding standards
        run: composer install --no-interaction --prefer-dist

      - name: WordPress coding standards
        run: vendor/bin/phpcs

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP for the cross-language comparison
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci

      - name: The committed bundles must match js/src
        run: node build.mjs --check

      - name: The two renderers must agree
        run: npm test
